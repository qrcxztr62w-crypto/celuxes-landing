<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Celuxes Landing</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.5;
        background: #f5f6f8;
        color: #18202a;
      }
      body {
        margin: 0;
      }
      .hero {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 48px 24px;
      }
      .card {
        max-width: 720px;
        background: #ffffff;
        border-radius: 24px;
        padding: 48px;
        box-shadow: 0 24px 48px rgba(24, 32, 42, 0.12);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 999px;
        background: #eef1ff;
        color: #2c3b87;
        font-weight: 600;
        font-size: 14px;
      }
      h1 {
        margin: 18px 0 12px;
        font-size: clamp(32px, 5vw, 48px);
      }
      p {
        margin: 0 0 18px;
        font-size: 18px;
        color: #3b4655;
      }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        border-radius: 12px;
        background: #202c7f;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
      }
      .footer {
        margin-top: 28px;
        font-size: 14px;
        color: #6a7483;
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <section class="card">
        <span class="pill">Yeni Landing • 2024</span>
        <h1>Celuxes deneyimini keşfedin</h1>
        <p>
          Ürün lansmanlarımızı takip etmek, yaklaşan koleksiyonları görmek ve
          ekipten son güncellemeleri almak için doğru yerdesiniz.
        </p>
        <a class="cta" href="mailto:hello@celuxes.com">Bizimle iletişime geçin</a>
        <div class="footer">Yakında daha fazlası geliyor.</div>
      </section>
    </main>
  </body>
</html>
